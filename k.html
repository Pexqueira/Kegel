<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Treino de Precisão</title>
    <style>
        :root {
            --c-PREPARE: #6a5acd;
            --c-cont: #ff4757;
            --c-RELAXE: #2ed573;
        }

        body {
            font-family: sans-serif;
            background-color: #f8f9fa;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            width: 90%;
            max-width: 400px;
            text-align: center;
        }

        .timer-circle {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            border: 10px solid var(--c-PREPARE);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 20px auto;
            transition: all 0.5s ease-in-out;
        }

        .state-PREPARE {
            border-color: var(--c-PREPARE);
            transform: scale(1);
        }

        .state-CONTRAIA {
            border-color: var(--c-cont);
            transform: scale(0.85);
        }

        .state-RELAXE {
            border-color: var(--c-RELAXE);
            transform: scale(1.15);
        }

        .state-DESCANSE {
            border-color: var(--c-PREPARE);
            transform: scale(1);
        }

        #status-label {
            font-size: 1rem;
            font-weight: bold;
            color: #555;
        }

        #timer-display {
            font-size: 5rem;
            font-weight: 900;
            color: #333;
        }

        .progress-container {
            width: 100%;
            height: 15px;
            background: #ddd;
            border-radius: 10px;
            margin: 15px 0;
            overflow: hidden;
        }

        #progress-bar {
            height: 100%;
            width: 0%;
            background: var(--c-PREPARE);
            transition: 0.3s;
        }

        button {
            background: var(--c-PREPARE);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            margin: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div style="margin-bottom:10px;">
            <button onclick="setDuration(5)">5s</button>
            <button onclick="setDuration(8)">8s</button>
            <button onclick="setDuration(10)">10s</button>
        </div>

        <div class="timer-circle state-PREPARE" id="circle">
            <div id="status-label">PRONTO</div>
            <div id="timer-display">3</div>
        </div>

        <div id="info" style="font-weight:bold;">Série 0/3 | Repet. 0/10</div>
        <div class="progress-container"><div id="progress-bar"></div></div>

        <button id="mainBtn" onclick="toggleApp()">INICIAR</button>
        <button id="resetBtn" onmousedown="startReset()" onmouseup="clearReset()" ontouchstart="startReset()" ontouchend="clearReset()" style="background:#ff4757">Segure 3s para Resetar</button>

        <div style="margin-top:10px;">Sessões hoje: <span id="daily-count">0</span> / 3</div>
    </div>

    <script>
        let serie = 0, rep = 0, phase = 'PREPARE', timeLeft = 3, duration = 5, running = false, paused = false, timer, resetTimer;
        let today = new Date().toDateString();
        let daily = (localStorage.getItem('lastDate') === today) ? parseInt(localStorage.getItem('daily') || 0) : 0;
        document.getElementById('daily-count').innerText = daily;
        document.getElementById('progress-bar').style.width = (daily / 3 * 100) + "%";

        function setDuration(val) { duration = val; if (!running) { timeLeft = val; document.getElementById('timer-display').innerText = val; } }

        function toggleApp() {
            if (!running) { running = true; document.getElementById('mainBtn').innerText = "PAUSAR"; run(); }
            else { paused = !paused; document.getElementById('mainBtn').innerText = paused ? "RETOMAR" : "PAUSAR"; }
        }

        function run() {
            updateUI();
            timer = setInterval(() => {
                if (paused) return;
                timeLeft--;
                if (timeLeft < 0) {
                    if (window.navigator.vibrate) window.navigator.vibrate(300);
                    if (phase === 'PREPARE') { phase = 'CONTRAIA'; timeLeft = duration; }
                    else if (phase === 'CONTRAIA') { phase = 'RELAXE'; timeLeft = 5; }
                    else if (phase === 'RELAXE') {
                        rep++;
                        if (rep < 10) { phase = 'CONTRAIA'; timeLeft = duration; }
                        else {
                            serie++; rep = 0;
                            if (serie < 3) { phase = 'DESCANSE'; timeLeft = 60; }
                            else {
                                daily++; localStorage.setItem('daily', daily); localStorage.setItem('lastDate', today);
                                alert("Sessão diária concluída!"); location.reload();
                            }
                        }
                    } else if (phase === 'DESCANSE') { phase = 'CONTRAIA'; timeLeft = duration; }
                    updateUI();
                }
                document.getElementById('timer-display').innerText = timeLeft;
            }, 1000);
        }

        function updateUI() {
            document.getElementById('status-label').innerText = phase.toUpperCase();
            document.getElementById('info').innerText = `Série ${serie}/3 | Repet. ${rep}/10`;
            document.getElementById('progress-bar').style.width = (daily / 3 * 100) + "%";
            const circle = document.getElementById('circle');
            circle.className = 'timer-circle ' + (phase === 'CONTRAIA' ? 'state-CONTRAIA' : (phase === 'RELAXE' ? 'state-RELAXE' : (phase === 'DESCANSE' ? 'state-DESCANSE' : 'state-PREPARE')));
        }

        function startReset() { resetTimer = setTimeout(() => { localStorage.clear(); location.reload(); }, 3000); }
        function clearReset() { clearTimeout(resetTimer); }
    </script>
</body>
</html>
